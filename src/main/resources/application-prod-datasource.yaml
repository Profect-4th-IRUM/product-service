spring:
  config:
    activate:
      on-profile: "prod-datasource"

  datasource:
    write:
      jdbc-url: jdbc:postgresql://${WRITE_POSTGRESQL_HOST}:${WRITE_POSTGRESQL_PORT}/${WRITE_DB_NAME}
      username: ${WRITE_POSTGRESQL_USERNAME}
      password: ${WRITE_POSTGRESQL_PASSWORD}
      driver-class-name: org.postgresql.Driver
    read:
      jdbc-url: jdbc:postgresql://${READ_POSTGRESQL_HOST}:${READ_POSTGRESQL_PORT}/${READ_DB_NAME}
      username: ${READ_POSTGRESQL_USERNAME}
      password: ${READ_POSTGRESQL_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        hibernate.format_sql: true
        hibernate.highlight_sql: true
        hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
      encoding: UTF-8