spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  liquibase:
    enabled: false


  kafka:
    consumer:
      group-id: ${ORDER_GROUP_ID:order-service-group}
    topics:
      order-failed: ${ORDER_FAILED_TOPIC_NAME:order-failed}